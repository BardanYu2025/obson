<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Babel · 两图对照</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101719;color:#e7eeea;font:15px/1.65 system-ui,-apple-system,sans-serif}main{max-width:1150px;margin:auto;padding:25px}header{display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid #344543;padding-bottom:16px}h1{font-size:24px;margin:0}h2{font-size:15px;margin:0 0 8px}.muted,small{color:#a2b1ab}.intro{margin:18px 0}.panel{background:#172124;border:1px solid #344543;border-radius:9px;padding:15px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}canvas{display:block;width:100%;height:190px}#query{height:205px}fieldset{border:1px solid #344543;border-radius:8px;margin:13px 0;padding:12px 16px}legend{font-weight:600;padding:0 6px}fieldset p{margin:0 0 10px;color:#a2b1ab;font-size:13px}.choices{display:flex;gap:10px;flex-wrap:wrap}.choices label{display:flex;align-items:center;gap:7px;cursor:pointer;padding:8px 12px;background:#1d2c2e;border-radius:6px;border:1px solid #435653}.choices label:has(input:checked){border-color:#bdce81;color:#d9eaa9}input{accent-color:#bdce81}button{font:inherit;color:#e7eeea;background:#24332d;border:1px solid #70895f;border-radius:6px;padding:8px 15px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.nav{display:flex;gap:10px;align-items:center;justify-content:space-between;position:sticky;bottom:0;background:#101719;padding:15px 0}.message{color:#d9eaa9;min-height:25px}#storage{font-size:12px}#position{font-variant-numeric:tabular-nums}.legend{display:flex;gap:14px;font-size:12px;color:#a2b1ab;margin-top:5px}@media(max-width:650px){main{padding:14px}.pair{grid-template-columns:1fr}header{align-items:flex-start}#query{height:170px}canvas{height:160px}.choices label{padding:7px}.nav{flex-wrap:wrap}}
</style>
<main>
<header><div><small>BABEL · 形态参考评估</small><h1>哪张图更适合拿来对照？</h1></div><span id="position"></span></header>
<div class="intro">把上面的查询图当作当前行情，分别比较下面两张图。<strong>不猜后续涨跌，也不用选一个总冠军。</strong>拿不准就选“无法判断”；两者相似程度接近就选“差不多”。
<div class="muted">各图独立缩放，忽略绝对价格。淡色区域标出每张图的末尾部分，全部是已观察行情。</div></div>
<article class="panel"><h2>查询图</h2><canvas id="query" aria-label="当前查询K线"></canvas><div class="legend"><span>橙色：上涨</span><span>绿色：下跌</span><span>淡色区域：末尾 20%</span></div></article>
<div class="pair"><article class="panel"><h2>左图</h2><canvas id="left" aria-label="左侧历史候选K线"></canvas></article><article class="panel"><h2>右图</h2><canvas id="right" aria-label="右侧历史候选K线"></canvas></article></div>
<div id="questions"></div>
<div id="storage" class="muted"></div><div class="message" id="message" role="status"></div>
<nav class="nav"><button id="previous">上一组</button><span id="progress"></span><button id="next">下一组</button><button id="export">下载本次选择</button></nav>
</main>
<script>
const packet=__PACKET__;
const dimensions=[['trend','整体走势','看整体是上涨、下降、震荡，还是趋势之后的整理。'],['turns','转折顺序','看涨跌段出现的先后，以及高点、低点的相对关系。'],['endpoint','右端位置','看最右端处于回调、反弹、试探前高／前低，还是突破之后。']];
const choices=[['left','左图更像'],['right','右图更像'],['tie','差不多'],['uncertain','无法判断']];
const $=id=>document.getElementById(id),storageKey='babel-pairs-'+packet.packet_id;
let index=0,ratings={},storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');for(const c of packet.cases){ratings[c.id]={};for(const[d]of dimensions){const v=saved.ratings?.[c.id]?.[d];if(choices.some(([k])=>k===v))ratings[c.id][d]=v}}index=Math.max(0,Math.min(packet.cases.length-1,Number(saved.index)||0))}catch(e){storageOK=false}
function answered(){return packet.cases.reduce((n,c)=>n+dimensions.filter(([d])=>ratings[c.id]?.[d]).length,0)}
function status(){const n=answered(),total=packet.cases.length*dimensions.length;$('progress').textContent=`已回答 ${n}/${total} 项`;$('storage').textContent=storageOK?'选择保存在当前浏览器中；仍请下载CSV留存。':'当前浏览器不能保存本地进度，关闭页面前请先下载CSV。';$('previous').disabled=index===0;$('next').disabled=index===packet.cases.length-1}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({ratings,index}))}catch(e){storageOK=false}status()}
function draw(id,bars){const el=$(id),r=el.getBoundingClientRect(),d=devicePixelRatio||1;el.width=r.width*d;el.height=r.height*d;const c=el.getContext('2d');c.scale(d,d);const top=Math.max(...bars.map(b=>b.high)),bottom=Math.min(...bars.map(b=>b.low)),span=Math.max(top-bottom,.00001),step=r.width/bars.length,y=v=>12+(top-v)/span*(r.height-24);c.fillStyle='#bdce8110';c.fillRect(r.width*.8,0,r.width*.2,r.height);c.strokeStyle='#344543';for(let i=1;i<4;i++){c.beginPath();c.moveTo(0,r.height*i/4);c.lineTo(r.width,r.height*i/4);c.stroke()}bars.forEach((b,i)=>{const x=(i+.5)*step;c.strokeStyle=c.fillStyle=b.close>=b.open?'#e49a7a':'#79b8ab';c.beginPath();c.moveTo(x,y(b.high));c.lineTo(x,y(b.low));c.stroke();c.fillRect(x-step*.3,Math.min(y(b.open),y(b.close)),Math.max(1,step*.6),Math.max(1,Math.abs(y(b.open)-y(b.close))))})}
function charts(){const c=packet.cases[index];draw('query',c.query);draw('left',c.left);draw('right',c.right)}
function render(){const card=packet.cases[index];$('position').textContent=`第 ${index+1}/${packet.cases.length} 组`;$('questions').replaceChildren();for(const[d,title,help]of dimensions){const fs=document.createElement('fieldset'),legend=document.createElement('legend'),p=document.createElement('p'),options=document.createElement('div');legend.textContent=title;p.textContent=help;options.className='choices';fs.append(legend,p,options);for(const[value,text]of choices){const label=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name=d;input.value=value;input.setAttribute('aria-label',title+'：'+text);input.checked=ratings[card.id]?.[d]===value;input.onchange=()=>{(ratings[card.id]??={})[d]=value;$('message').textContent='';save()};label.append(input,document.createTextNode(text));options.append(label)}$('questions').append(fs)}charts();status()}
$('previous').onclick=()=>{if(index>0){index--;save();render();window.scrollTo({top:0,behavior:'smooth'})}};$('next').onclick=()=>{if(index<packet.cases.length-1){index++;save();render();window.scrollTo({top:0,behavior:'smooth'})}};
$('export').onclick=()=>{const n=answered(),total=packet.cases.length*3;if(n===0){$('message').textContent='还没有记录任何选择。请先回答一项，再下载；不确定可以选“无法判断”。';return}const lines=['packet_id,case_id,trend,turns,endpoint'];for(const c of packet.cases)lines.push([packet.packet_id,c.id,...dimensions.map(([d])=>ratings[c.id]?.[d]||'')].join(','));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')+'\n'],{type:'text/csv;charset=utf-8'}));a.download='pair_ratings_'+packet.packet_id+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('message').textContent=`已导出 ${n}/${total} 项选择；空白保留为空，不会记成平局。`};
window.addEventListener('resize',charts);render();
</script></html>
