<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Babel · 结构看盘</title>
<style>
:root{color-scheme:dark;--bg:#101719;--panel:#172124;--ink:#e7eeea;--muted:#91a49d;--line:#2a3b3c;--accent:#bdce81;--up:#e49a7a;--down:#79b8ab}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1500px;margin:auto;padding:30px 40px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:24px}h1{font-size:29px;letter-spacing:3px;margin:0}h2{font-size:17px;margin:0 0 14px}small,.muted{color:var(--muted)}.tag{color:var(--accent);font-size:12px;letter-spacing:2px}.toolbar,.replay{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}label{display:grid;gap:5px;color:var(--muted);font-size:12px}button,select,input{background:#1e2c2e;border:1px solid #3b5150;border-radius:6px;color:var(--ink);padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.35;cursor:default}input[type=range]{flex:1;accent-color:var(--accent);min-width:150px;padding:0}input[type=datetime-local]{min-width:225px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}.panel canvas{width:100%;display:block}#main-chart{height:390px}#volume-chart{height:110px}.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 0}.scale{padding:14px 0;border-bottom:1px solid var(--line)}.scale strong{display:flex;justify-content:space-between;font-weight:500}.scale p{font-size:12px;color:var(--muted);margin:6px 0}.notice{padding:12px 15px;border-left:3px solid var(--accent);background:#24302b;margin:14px 0;font-size:13px}.error{border-color:var(--up);color:var(--up)}.matches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}.match{cursor:pointer}.match:hover{border-color:var(--accent)}.match canvas{height:130px}.match header{margin:0;padding:0 0 8px;border:0;font-size:12px}.outcomes{display:flex;gap:12px;color:var(--muted);font-size:11px}section{margin-top:24px}.section-head{display:flex;justify-content:space-between;align-items:center}.pill{padding:2px 8px;border:1px solid var(--line);border-radius:20px;font-size:11px;color:var(--muted)}#error:empty{display:none}#status{min-height:24px;color:var(--muted)}#detail{display:none;margin-top:20px}#detail canvas{height:320px}footer{color:var(--muted);font-size:12px;margin:30px 0}a{color:var(--accent)}@media(max-width:1000px){main{padding:20px}.grid{grid-template-columns:1fr}.matches{grid-template-columns:1fr 1fr}}@media(max-width:650px){.matches{grid-template-columns:1fr}header{align-items:flex-start}#main-chart{height:300px}}
</style>
<main>
<header><div><div class="tag">OBSERVE · COMPARE · UNDERSTAND</div><h1>BABEL <span style="font-size:16px;letter-spacing:0;font-weight:400">结构看盘</span></h1></div><div class="muted">本地研究工作台<br><small>历史回放 · 已收盘 K 线</small></div></header>
<div class="toolbar"><label>品种 / 周期<select id="pair"></select></label><label>检索依据<select id="method"></select></label><label>查询截止时间 · 上海<input id="asof" type="datetime-local"></label><button id="query">查看结构</button><button id="export">导出本次证据</button></div>
<div class="replay"><button id="back20">−20 根</button><button id="back">上一根</button><input id="timeline" type="range" min="0" max="0" value="0" aria-label="历史回放位置"><button id="next">下一根</button><button id="last">数据末尾</button></div>
<div id="status" role="status">正在加载本地数据…</div><div id="error" class="notice error" role="alert"></div>
<div class="grid"><article class="panel"><div class="section-head"><h2 id="chart-title">当前窗口</h2><span class="pill" id="contract"></span></div><div class="legend"><span style="color:var(--up)">● 上涨</span><span style="color:var(--down)">● 下跌</span><span>▲ 已确认低点 / ▼ 已确认高点（中尺度）</span></div><canvas id="main-chart" aria-label="K线与已确认枢轴"></canvas><div class="legend">成交量 · 持仓量（独立纵轴）</div><canvas id="volume-chart" aria-label="成交量柱图与持仓量曲线"></canvas></article><aside class="panel"><h2>此刻可知的结构 <span class="pill">规则基线</span></h2><div id="scales"></div><div id="conditions"></div><div id="patterns"></div><div id="alerts"></div><div id="model"></div></aside></div>
<section><div class="section-head"><h2>历史结构参照</h2><span class="muted" id="match-info">按时间去重 · 只用此前历史</span></div><small>点击案例查看细节。阴影区为该案例之后、且在查询时刻已经发生的行情。相似分数不是上涨概率。</small><div class="matches" id="matches"></div></section>
<article id="detail" class="panel"><h2 id="detail-title"></h2><canvas id="detail-chart"></canvas><div id="detail-text"></div></article>
<footer id="notes"></footer>
</main>
<script>
const $=id=>document.getElementById(id);let times=[],current=null,selected=null,requestId=0;
const names={rule:'结构规则 · 显式基线',path:'价格路径 · 几何基线',model:'学习表示 · 实验模型'};
const fmt=(x,n=2)=>x==null?'—':Number(x).toFixed(n);
async function api(path){const r=await fetch(path);const j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}
function canvas(id){const e=typeof id==='string'?$(id):id,r=e.getBoundingClientRect(),d=window.devicePixelRatio||1;e.width=r.width*d;e.height=r.height*d;const c=e.getContext('2d');c.scale(d,d);return[c,r.width,r.height]}
function chart(id,snap,small=false){const[c,w,h]=canvas(id),bars=snap.bars;if(!bars.length)return;const pad=small?5:30,right=small?4:55,lo=Math.min(...bars.map(b=>b.low)),hi=Math.max(...bars.map(b=>b.high)),span=Math.max(hi-lo,.001),x=i=>pad+(i+.5)*(w-pad-right)/bars.length,y=p=>pad+(hi-p)/span*(h-2*pad),bw=(w-pad-right)/bars.length; c.clearRect(0,0,w,h);c.font='11px system-ui';if(!small){for(let k=0;k<5;k++){let p=lo+span*k/4,yy=y(p);c.strokeStyle='#2a3b3c';c.beginPath();c.moveTo(pad,yy);c.lineTo(w-right,yy);c.stroke();c.fillStyle='#91a49d';c.fillText(fmt(p),w-right+6,yy+4)}}const anchor=bars.findIndex(b=>b.row===snap.row);if(anchor>=0&&anchor<bars.length-1){c.fillStyle='#bdce8114';c.fillRect(x(anchor)+bw/2,0,w-x(anchor)-right,h)}bars.forEach((b,i)=>{c.strokeStyle=c.fillStyle=b.close>=b.open?'#e49a7a':'#79b8ab';c.beginPath();c.moveTo(x(i),y(b.high));c.lineTo(x(i),y(b.low));c.stroke();c.fillRect(x(i)-bw*.32,Math.min(y(b.open),y(b.close)),Math.max(1,bw*.64),Math.max(1,Math.abs(y(b.open)-y(b.close))))});if(!small&&snap.structure){for(const p of snap.structure.pivots.filter(p=>p.scale===1&&p.event>=bars[0].row)){const i=p.event-bars[0].row;if(i>=bars.length)continue;c.fillStyle='#bdce81';c.fillText(p.kind===1?'▼':'▲',x(i)-5,y(p.price)+(p.kind===1?-7:16))}c.fillStyle='#91a49d';c.fillText(bars[0].time.slice(0,16),pad,h-4);c.fillText(bars[Math.min(anchor<0?bars.length-1:anchor,bars.length-1)].time.slice(0,16),Math.max(pad,w-210),h-4)}}
function volume(snap){const[c,w,h]=canvas('volume-chart'),bs=snap.bars,m=Math.max(...bs.map(b=>b.volume),1),ois=bs.map(b=>b.oi),lo=Math.min(...ois),span=Math.max(...ois)-lo||1,bw=(w-85)/bs.length;c.clearRect(0,0,w,h);bs.forEach((b,i)=>{c.fillStyle=b.close>=b.open?'#e49a7a55':'#79b8ab55';c.fillRect(30+i*bw,h-20-b.volume/m*(h-35),Math.max(1,bw*.7),b.volume/m*(h-35))});if(snap.oi_available){c.strokeStyle='#bdce81';c.beginPath();ois.forEach((v,i)=>{let x=30+i*bw,y=h-20-(v-lo)/span*(h-35);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}c.fillStyle='#91a49d';c.font='11px system-ui';c.fillText('量 '+fmt(bs.at(-1).volume,0)+'  仓 '+(snap.oi_available?fmt(bs.at(-1).oi,0):'缺失'),30,12)}
function render(r){current=r;selected=null;$('detail').style.display='none';const q=r.query;$('chart-title').textContent=`${q.code.toUpperCase()} · ${q.period} 分钟`;$('contract').textContent=q.contract;$('status').textContent=`数据截至 ${q.available_at.slice(0,16).replace('T',' ')}（bar收盘可用时间） · 交易时段 ${q.session} · ${names[r.method]}`;chart('main-chart',q);volume(q);$('scales').replaceChildren();q.structure.scales.forEach((s,i)=>{let el=document.createElement('div');el.className='scale';el.innerHTML=`<strong><span>${['短','中','长'][i]}尺度 · ${s.scale} ATR</span><span>${s.state}</span></strong><p>${s.leg} · 距已确认极值 ${s.bars_since_extreme} 根 · 位移 ${fmt(s.amplitude_atr)} ATR</p><p>确认低点 ${fmt(s.support)}　确认高点 ${fmt(s.resistance)}</p>`;$('scales').append(el)});$('conditions').className='notice';$('conditions').textContent=(q.structure.compression?'波动收缩；不代表即将突破':'当前未触发波动收缩规则')+` · 路径效率 ${fmt(q.structure.efficiency)}`;$('patterns').replaceChildren();q.structure.patterns.forEach(p=>{let el=document.createElement('p');el.textContent=`${p.name}（${['短','中','长'][p.scale]}）：${p.status}；颈线 ${fmt(p.neckline)}`;$('patterns').append(el)});if(!q.structure.patterns.length)$('patterns').textContent='暂无满足规则的双顶/底或头肩形态。';$('alerts').replaceChildren();q.structure.alerts.forEach(a=>{let el=document.createElement('div');el.className='notice';el.textContent=a;$('alerts').append(el)});$('model').textContent=r.model_estimates?'模型中尺度摆动估计：'+['降','未定','升'].map((n,i)=>n+' '+fmt(r.model_estimates.direction[1][i]*100,0)+'%').join(' / ')+'（未校准，规则拟合实验）':'学习表示尚未接入，或该历史时点早于模型冻结时间。';$('matches').replaceChildren();r.matches.forEach((m,i)=>{let el=document.createElement('article');el.className='panel match';let head=document.createElement('header');head.textContent=`${i+1}. ${m.code.toUpperCase()} · ${m.period}m · ${m.available_at.slice(0,10)}　相似 ${fmt(m.similarity,3)}`;el.append(head);let cv=document.createElement('canvas');el.append(cv);let foot=document.createElement('div');foot.className='outcomes';foot.textContent=Object.entries(m.outcomes).map(([n,v])=>`后${n}根 ${v==null?'未可知':fmt(v)+' ATR'}`).join('  ');el.append(foot);$('matches').append(el);chart(cv,m,true);el.onclick=()=>{selected=m;$('detail').style.display='block';$('detail-title').textContent=`${m.contract} · ${m.available_at.slice(0,16)}`;$('detail-text').textContent='结构状态以案例锚点当时可知信息计算；右侧阴影行情仅供事后参照。';chart('detail-chart',m);$('detail').scrollIntoView({behavior:'smooth',block:'nearest'})}});$('match-info').textContent=`${r.matches.length} 个不重叠历史案例`;if(!r.matches.length)$('matches').textContent='该时点之前没有足够的独立历史窗口。';$('notes').textContent=r.notes.join(' ')}
async function run(){const token=++requestId;$('error').textContent='';$('status').textContent='正在按此时点重建结构与历史参照…';try{let [code,period]=$('pair').value.split('/');let q=new URLSearchParams({code,period,asof:$('asof').value,method:$('method').value,topk:'6'});let result=await api('/api/query?'+q);if(token===requestId)render(result)}catch(e){if(token===requestId){$('error').textContent=e.message;$('status').textContent='本次查询未完成；图表如有显示，仍是上一次成功查询。'}}}
function setTime(index){index=Math.max(0,Math.min(times.length-1,index));$('timeline').value=index;$('asof').value=times[index]?.slice(0,16)||'';$('back').disabled=index===0;$('next').disabled=index===times.length-1}
async function pairChanged(){try{let[code,period]=$('pair').value.split('/');times=await api('/api/times?'+new URLSearchParams({code,period}));$('timeline').max=Math.max(0,times.length-1);setTime(times.length-1);await run()}catch(e){$('error').textContent=e.message}}
$('query').onclick=run;$('method').onchange=run;$('pair').onchange=pairChanged;$('timeline').onchange=()=>{setTime(+$('timeline').value);run()};for(const[id,delta]of[['back',-1],['back20',-20],['next',1]])$(id).onclick=()=>{setTime(+$('timeline').value+delta);run()};$('last').onclick=()=>{setTime(times.length-1);run()};$('export').onclick=()=>{if(!current)return;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json'}));a.download='babel-evidence.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};window.addEventListener('resize',()=>{if(current){chart('main-chart',current.query);volume(current.query);document.querySelectorAll('.match canvas').forEach((c,i)=>chart(c,current.matches[i],true));if(selected)chart('detail-chart',selected)}});
(async()=>{try{let c=await api('/api/catalog');for(let[code,p]of c.pairs){let o=new Option(`${code.toUpperCase()} / ${p}分钟`,`${code}/${p}`);$('pair').add(o)}for(let m of c.methods)$('method').add(new Option(names[m],m));await pairChanged()}catch(e){$('error').textContent=e.message}})();
</script></html>
