<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Babel · 形态盲评</title>
<style>body{background:#101719;color:#e7eeea;font:15px/1.6 system-ui;max-width:1100px;margin:35px auto;padding:20px}canvas{width:100%;height:160px;background:#172124;border-radius:8px}section{margin:30px 0;border-top:1px solid #3b5150;padding-top:20px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}button,select{background:#24332d;color:#e7eeea;padding:12px;border:1px solid #bdce81;border-radius:6px}button{cursor:pointer}header{position:sticky;top:0;background:#101719;padding:12px 0;z-index:1}small{color:#91a49d}h2{font-size:18px}</style>
<header><h1>Babel · 形态盲评</h1><p>只判断结构是否相似，不猜品种，不评价后续收益。0 不相关 / 1 部分相关 / 2 高度相关；允许全部不相关。未选项目不计分。</p><button id="save">下载评分 CSV</button><small id="count"></small></header><main id="cases"></main>
<script>const cases=__CASES__,ratings={};function draw(canvas,bars){let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;let c=canvas.getContext('2d');c.scale(d,d);let hi=Math.max(...bars.map(b=>b.high)),lo=Math.min(...bars.map(b=>b.low)),step=r.width/bars.length,y=p=>12+(hi-p)/Math.max(hi-lo,.001)*(r.height-24);bars.forEach((b,i)=>{let x=(i+.5)*step;c.strokeStyle=c.fillStyle=b.close>=b.open?'#e49a7a':'#79b8ab';c.beginPath();c.moveTo(x,y(b.high));c.lineTo(x,y(b.low));c.stroke();c.fillRect(x-step*.3,Math.min(y(b.open),y(b.close)),Math.max(1,step*.6),Math.max(1,Math.abs(y(b.open)-y(b.close))))})}for(let item of cases){let section=document.createElement('section'),h=document.createElement('h2');h.textContent=item.id+' · 查询窗口';section.append(h);let q=document.createElement('canvas');section.append(q);let choices=document.createElement('div');choices.className='choices';section.append(choices);document.getElementById('cases').append(section);draw(q,item.query);for(let alt of item.alternatives){let box=document.createElement('article'),label=document.createElement('h2');label.textContent='候选 '+alt.id;box.append(label);let cv=document.createElement('canvas');box.append(cv);let select=document.createElement('select');for(let[v,name]of[['','请选择'],['0','0 · 不相关'],['1','1 · 部分相关'],['2','2 · 高度相关']])select.add(new Option(name,v));select.onchange=()=>{ratings[item.id+'/'+alt.id]=select.value;document.getElementById('count').textContent=' 已评 '+Object.values(ratings).filter(v=>v!=='').length+' 条'};box.append(select);choices.append(box);draw(cv,alt.bars)}}document.getElementById('save').onclick=()=>{let csv='case_id,alternative,relevance_0_1_2,notes\n';for(let item of cases)for(let alt of item.alternatives)csv+=`${item.id},${alt.id},${ratings[item.id+'/'+alt.id]??''},\n`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ratings.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
